<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shamrockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ee57a" />
      <stop offset="40%" stop-color="#00b057" />
      <stop offset="100%" stop-color="#007a3d" />
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00994c" />
      <stop offset="100%" stop-color="#005e2d" />
    </linearGradient>
    <filter id="tabOutline" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>
  <g filter="url(#tabOutline)">
    <!-- Stem -->
    <path d="M 31.5,30 C 31.5,42 29,51 22,59.5 C 19.5,62.5 16,63.5 14,63.5 C 17,62 20.5,59.5 23,56 C 28.5,48.5 30,40.5 30,30 Z" 
          fill="url(#stemGrad)" stroke="#003d1c" stroke-width="0.6" stroke-linejoin="round" />
    
    <!-- Top Leaflet -->
    <g transform="translate(32, 28) rotate(0)">
      <path d="M 0,0 C -4,-5 -12,-12 -12,-19 C -12,-25.5 -3,-27 0,-21 C 3,-27 12,-25.5 12,-19 C 12,-12 4,-5 0,0 Z" 
            fill="url(#shamrockGrad)" stroke="#003d1c" stroke-width="0.8" stroke-linejoin="round" />
      <path d="M 0,-1 L 0,-20" stroke="#46f08c" stroke-width="0.8" stroke-linecap="round" opacity="0.55" />
    </g>

    <!-- Left Leaflet -->
    <g transform="translate(32, 28) rotate(-118)">
      <path d="M 0,0 C -4,-5 -12,-12 -12,-19 C -12,-25.5 -3,-27 0,-21 C 3,-27 12,-25.5 12,-19 C 12,-12 4,-5 0,0 Z" 
            fill="url(#shamrockGrad)" stroke="#003d1c" stroke-width="0.8" stroke-linejoin="round" />
      <path d="M 0,-1 L 0,-20" stroke="#46f08c" stroke-width="0.8" stroke-linecap="round" opacity="0.55" />
    </g>

    <!-- Right Leaflet -->
    <g transform="translate(32, 28) rotate(118)">
      <path d="M 0,0 C -4,-5 -12,-12 -12,-19 C -12,-25.5 -3,-27 0,-21 C 3,-27 12,-25.5 12,-19 C 12,-12 4,-5 0,0 Z" 
            fill="url(#shamrockGrad)" stroke="#003d1c" stroke-width="0.8" stroke-linejoin="round" />
      <path d="M 0,-1 L 0,-20" stroke="#46f08c" stroke-width="0.8" stroke-linecap="round" opacity="0.55" />
    </g>

    <!-- Center junction node -->
    <circle cx="32" cy="28" r="1.8" fill="#007a3d" />
  </g>
</svg>